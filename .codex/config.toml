#:schema https://developers.openai.com/codex/config-schema.json
# GENERATED by npm run host:compile; project-local additive baseline.

[features]
hooks = true
multi_agent = true

[agents]
max_concurrent_threads_per_session = 3

[mcp_servers.graphify]
command = "node"
args = ["scripts/mcp/graphify-server.mjs"]
required = true
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
required = true
startup_timeout_sec = 30
tool_timeout_sec = 60

[mcp_servers.supabase]
enabled = false
