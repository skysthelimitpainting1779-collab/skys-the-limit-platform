name: Bug report
description: Report a reproducible product or development defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets, customer data, or private provider credentials.
  - type: textarea
    id: outcome
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable reproduction and affected route.
    validations:
      required: true
  - type: input
    id: sha
    attributes:
      label: Commit SHA or deployment ID
      description: Exact evidence is required for remote failures.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, cookies, PII, and private payloads.
