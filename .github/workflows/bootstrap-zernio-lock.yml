name: Bootstrap Zernio dependency lock

on:
  push:
    branches:
      - feature/zernio-integration
    paths:
      - .github/workflows/bootstrap-zernio-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/zernio-integration
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependency graph
        run: npm ci

      - name: Verify branch baseline
        run: npm run verify:branch

      - name: Commit generated lockfile
        shell: bash
        run: |
          rm .github/workflows/bootstrap-zernio-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/bootstrap-zernio-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: lock Zernio SDK dependency"
          git push origin HEAD:feature/zernio-integration
