name: Lead Intake E2E

on:
  pull_request:
    branches: [dev]
  push:
    branches: ["feature/**", "feat/**", "fix/**", "infra/**"]

permissions:
  contents: read

jobs:
  lead-intake-e2e:
    name: Lead Intake E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_DEPLOYMENT_TIER: test
      ENABLE_EXTERNAL_EFFECTS: "false"
      # Non-secret test-only values for the isolated local deployment. They do
      # not correspond to a WorkOS tenant and cannot authorize a real session.
      WORKOS_CLIENT_ID: client_local_ci_fail_closed
      WORKOS_API_KEY: sk_test_local_ci_fail_closed
      WORKOS_COOKIE_PASSWORD: local_ci_cookie_password_is_at_least_32_chars
      WORKOS_REDIRECT_URI: http://127.0.0.1:3100/auth/callback
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://127.0.0.1:3100/auth/callback
      WORKOS_ORGANIZATION_ID: org_local_ci_fail_closed
      WORKOS_WEBHOOK_SECRET: whsec_local_ci_fail_closed
      WORKOS_ACTION_SECRET: action_local_ci_fail_closed
      LEAD_INTAKE_SECRET: local_ci_lead_intake_proof_key_32_chars_minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start anonymous Convex backend
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env.local /tmp/convex.log /tmp/convex.pid
          # Initialize without pushing functions so deployment-scoped auth
          # variables exist before auth.config.ts is evaluated.
          CONVEX_AGENT_MODE=anonymous npx convex init
          npx convex env set WORKOS_CLIENT_ID "$WORKOS_CLIENT_ID"
          npx convex env set WORKOS_API_KEY "$WORKOS_API_KEY"
          npx convex env set WORKOS_WEBHOOK_SECRET "$WORKOS_WEBHOOK_SECRET"
          npx convex env set WORKOS_ACTION_SECRET "$WORKOS_ACTION_SECRET"
          npx convex env set WORKOS_ORGANIZATION_ID "$WORKOS_ORGANIZATION_ID"
          npx convex env set LEAD_INTAKE_SECRET "$LEAD_INTAKE_SECRET"

          nohup bash -lc 'CONVEX_AGENT_MODE=anonymous npx convex dev' > /tmp/convex.log 2>&1 &
          echo $! > /tmp/convex.pid

          ready=false
          for _ in $(seq 1 120); do
            if [[ -f .env.local ]] && grep -q 'Convex functions ready' /tmp/convex.log; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat /tmp/convex.pid)" 2>/dev/null; then
              cat /tmp/convex.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat /tmp/convex.log
            echo "Convex did not become ready within 120 seconds"
            exit 1
          fi

          npx convex run ci:ensureLocalTestOrganization '{"environment":"local-ci"}' >/dev/null

          grep -E '^(CONVEX_DEPLOYMENT|NEXT_PUBLIC_CONVEX_URL)=' .env.local >> "$GITHUB_ENV"

      - name: Build and start Next.js
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          nohup npm start -- -p 3100 > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid

          ready=false
          for _ in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/estimate || true)
            if [[ "$status" == "200" ]]; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat /tmp/next.pid)" 2>/dev/null; then
              cat /tmp/next.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat /tmp/next.log
            echo "Next.js did not become ready within 60 seconds"
            exit 1
          fi

      - name: Exercise real lead persistence and idempotency
        env:
          BASE_URL: http://127.0.0.1:3100
        run: node scripts/verify-lead-intake-e2e.mjs

      - name: Print service logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- Convex log ---'
          cat /tmp/convex.log 2>/dev/null || true
          echo '--- Next.js log ---'
          cat /tmp/next.log 2>/dev/null || true

      - name: Stop local services
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/next.pid ]]; then
            kill "$(cat /tmp/next.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/convex.pid ]]; then
            kill "$(cat /tmp/convex.pid)" 2>/dev/null || true
          fi
