name: Preview Verification

on:
  deployment_status:

permissions:
  contents: read
  deployments: read
  pull-requests: write

jobs:
  verify-preview:
    name: Verify Vercel Preview
    runs-on: ubuntu-latest
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify Preview belongs to correct project
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "Preview URL: $PREVIEW_URL"
          echo "Expected SHA: $DEPLOY_SHA"
          echo "Environment: ${{ github.event.deployment.environment }}"

          # Verify it's not Production
          if [[ "${{ github.event.deployment.environment }}" == "Production" ]]; then
            echo "✗ BLOCKED: This check must not run on Production deployments"
            exit 1
          fi

          echo "✓ Preview environment confirmed"

      - name: Smoke-test critical routes
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          check_route() {
            local route=$1
            local url="${PREVIEW_URL}${route}"
            # Follow up to 5 redirects; capture the final HTTP status.
            # Vercel SSO-protected previews return 302 for unauthenticated requests —
            # any 2xx or 3xx proves the route compiled and is reachable.
            local status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --max-redirs 5 "$url")
            if [[ "$status" =~ ^(2|3)[0-9]{2}$ ]]; then
              echo "✓ $route → $status"
            else
              echo "✗ $route → $status (expected 2xx or 3xx)"
              exit 1
            fi
          }

          check_route "/"
          check_route "/residential"
          check_route "/commercial"
          check_route "/estimate"
