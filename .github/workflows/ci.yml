name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, 'infra/**', 'feature/**', 'fix/**', 'docs/**', 'agent/**']

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate workflow integrity
        run: npm run verify:ci-contract

      - name: Validate skills schema
        run: npm run verify:skills

      - name: Validate environment contract
        run: npm run verify:env

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit & contract tests
        run: npm test

      - name: Build
        # Uses SKIP_ENV_VALIDATION to bypass WorkOS/Stripe checks (not configured in CI)
        # NEXT_PUBLIC_CONVEX_URL points at the real cloud deployment (neighborly-seahorse-366)
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_CONVEX_URL: "https://neighborly-seahorse-366.convex.cloud"

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify branch naming convention
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" =~ ^(main|dev|infra/|feature/|fix/|docs/|agent/|hotfix/|release/) ]]; then
            echo "✓ Branch name follows convention"
          else
            echo "✗ Branch '$BRANCH' does not follow naming convention"
            echo "  Allowed prefixes: main, dev, infra/, feature/, fix/, docs/, agent/, hotfix/, release/"
            exit 1
          fi
