name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, 'infra/**', 'feature/**', 'fix/**', 'docs/**', 'agent/**']

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate skills schema
        run: npm run verify:skills

      - name: Validate environment contract
        run: npm run verify:env

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit & contract tests
        run: npm test

      - name: Build
        # CI renders the explicit fail-closed configuration state and never
        # couples a build to a persistent Convex or WorkOS environment.
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_CONVEX_URL: "https://ci-placeholder.convex.cloud"

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify branch naming convention
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Branch: $BRANCH"
          if [[ "$BRANCH" =~ ^(main|dev|infra/|feature/|fix/|docs/|agent/|hotfix/|release/) ]]; then
            echo "✓ Branch name follows convention"
          else
            echo "✗ Branch '$BRANCH' does not follow naming convention"
            echo "  Allowed prefixes: main, dev, infra/, feature/, fix/, docs/, agent/, hotfix/, release/"
            exit 1
          fi
